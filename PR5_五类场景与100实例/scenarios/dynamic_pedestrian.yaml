# 场景模板：动态行人 dynamic_pedestrian（E14 / 5场景需求清单.md）
scenario: dynamic_pedestrian
description: 起终点直线 10 m，1~2 个行人垂直横穿，匀速直线、不折返不停止
asset_version: "2026-11-03"
map_version: "e05_min_scene@2026-11-01"
timeout_s: 60
goal_tolerance: {pos_m: 0.25, yaw_rad: 0.25}

corridor_length_m: [9.5, 10.5]
pedestrian_count: [1, 2]
pedestrian_radius_m: 0.30
pedestrian_speed_mps: [0.6, 1.0]
cross_half_span_m: 3.0             # 行人从 y=±3.0 出发横穿
cross_x_jitter_m: 2.0              # 交叉点在中点 ±2 m
encounter_time_s: 8.0              # 名义相遇时刻（到中点直线的时间）
encounter_jitter_s: 2.0            # 相遇时刻 ±2 s
