controller_server:
  ros__parameters:
    controller_frequency: 20.0
    controller_plugins: ["FollowPath"]
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    min_x_velocity_threshold: 0.0
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.0

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 60.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "mpc_controller::MpcController"
      # 底盘参数（方案 A：契约 schema 作 FollowPath 子键；W5 只消费这些项）
      type: "omni"                  # omni | mecanum | diff
      footprint:
        radius: 0.30
      limits:
        v_max: 1.0
        v_min: -1.0
        vy_max: 1.0
        omega_max: 1.5
        acc_max: 1.0
        alpha_max: 2.0
      # D2 最小直通跟随器参数（W6 换真 MPC 后由 MPC 参数替代）
      desired_linear_vel: 0.6
      lookahead_dist: 0.5
      rotation_gain: 2.0
      # D3 动态障碍心跳失联阈值（s，ROS 时钟）
      obstacle_timeout: 0.5
      # 全局路径 -> 局部 costmap 帧的 TF 查询超时（s）
      transform_tolerance: 0.2

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.30
      transform_tolerance: 0.5
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
