# 场景模板：窄通道 narrow_passage（E14 / 5场景需求清单.md）
# 净宽按整机 footprint 0.662 m 折算：单侧余量 = (净宽 − 0.662)/2 ≥ 0.30 m ⇒ 净宽 ≥ 1.262 m，
# 需求清单另给硬下限 1.3 m，生成器取两者更严者。
scenario: narrow_passage
description: 接近但大于整机宽度的直线通道，长 3±0.5 m，净宽 1.3~1.5 m
asset_version: "2026-11-03"
map_version: "e05_min_scene@2026-11-01"
timeout_s: 60
goal_tolerance: {pos_m: 0.25, yaw_rad: 0.25}

approach_length_m: 6.0             # 起点到通道入口的直线距离
passage_length_m: [2.5, 3.5]       # 需求：3±0.5 m
net_width_m: [1.30, 1.50]          # 需求：1.4±0.1 m
net_width_min_m: 1.30              # 硬下限
