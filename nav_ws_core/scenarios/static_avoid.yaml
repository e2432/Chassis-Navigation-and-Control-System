# 场景模板：静态绕行 static_avoid（路线书 E14 / 算法侧 5场景需求清单.md）
# 生成器：python3 -m robot_benchmark.gen_scenarios --out scenarios --runs 20
scenario: static_avoid
description: 起终点直线 10 m，航线附近 4~6 个静态圆障碍，需绕行
asset_version: "2026-11-03"
map_version: "e05_min_scene@2026-11-01"
timeout_s: 60
goal_tolerance: {pos_m: 0.25, yaw_rad: 0.25}

corridor_length_m: [9.5, 10.5]     # 直线长度（目标点 x）
corridor_half_width_m: 2.6         # 可行区域半宽（地面 12×6 m）
obstacle_count: [4, 6]             # 需求：4~6 个
obstacle_radius_m: [0.30, 0.60]    # 逐障碍独立抽样
lateral_offset_m: 1.5              # 横向偏置 ±1.5 m（另加位置抖动 ±0.3 m）
obstacle_x_range_m: [2.0, 1.5]     # x ∈ [2.0, L-1.5]，避开起点与目标
