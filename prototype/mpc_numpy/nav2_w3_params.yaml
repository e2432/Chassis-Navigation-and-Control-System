# W3 headless NavFn bringup（docs/MPC公式化.md §12）
# 只起 map_server + planner_server；lifecycle 由 run_w3.sh 手动转移，无 controller/bt/定位。
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"   # 加载失败则改 nav2_navfn_planner::NavfnPlanner
      tolerance: 0.0        # 精确到目标；默认 0.5 会提前收径 → 到达判失败
      use_astar: false      # Dijkstra，路径更平滑
      allow_unknown: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 0.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.30          # chassis/omni.yaml footprint.radius
      resolution: 0.05            # 与 mapping.py 一致
      track_unknown_space: false
      rolling_window: false
      plugins: ["static_layer", "inflation_layer"]   # 无 obstacle_layer：动态障碍永不进图
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35    # = 外缘 0.30 + 0.05（§12 定值）

map_server:
  ros__parameters:
    use_sim_time: false
    # yaml_filename 由 run_w3.sh 以 -p yaml_filename:=... 注入
