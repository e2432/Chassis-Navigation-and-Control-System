# 底盘参数化描述（契约 schema v1）—— 全向轮验证底盘
chassis:
  type: omni                  # omni | mecanum | diff
  footprint: { radius: 0.30 }
  limits:
    v_max: 1.0                # m/s
    v_min: -1.0
    vy_max: 1.0
    omega_max: 1.5            # rad/s
    acc_max: 1.0              # m/s²
    alpha_max: 2.0            # rad/s²
