# W4 基准实例的 NavFn 规划栈参数（与 W3 的 S1~S3 分开；run_w4.sh/run_w3.py 实例模式自动使用）
#
# 与 nav2_w3_params.yaml 的唯一实质差异：inflation_radius 0.35 → 0.60、
# cost_scaling_factor 3.0 → 5.0。
# 理由：W3 的 0.35 只是「外缘 0.30 + 0.05」的最小代价场；对 W4 的 0.30 m
# 局部安全余量，NavFn 会挑出穿过物理间隙 <0.3 m 的「最短折线」（实测
# static_avoid_05 / mixed_02 路径最小间隙仅 0.01~0.09 m），局部控制器正确
# 拒绝后被参考时间律拖成超时。W4 需要全局层先给出与 d_safe 匹配的可行折线；
# 这里把膨胀半径设到 robot_radius + d_safe = 0.60，并加大代价衰减斜率。
# W3 回归仍用 nav2_w3_params.yaml，S1~S3 存档基准不受影响。
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.0
      use_astar: false
      allow_unknown: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 0.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.30
      resolution: 0.05
      track_unknown_space: false
      rolling_window: false
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.60

map_server:
  ros__parameters:
    use_sim_time: false
