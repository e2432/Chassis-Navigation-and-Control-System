# 顶层启动参数（W1 骨架）
#
# 目标接口（路线书 E10/E27）：
#   ros2 launch robot_bringup simulation.launch.py use_sim_time:=true controller:=dwb
# 当前 simulation.launch.py 只组合 ROS 2 侧，Isaac Sim 仍需手工 GUI 启动（E10 解决）。

defaults:
  use_sim_time: true          # 参与仿真的节点一律 true（见 docs/engineering/bridge_check.md 5.4）
  controller: dwb             # 基线名：dwb | mppi | teb | mpc（E17/E22 实装）
  use_rviz: true
  ros_domain_id: 42
  rmw_implementation: rmw_fastrtps_cpp

# 组合关系（当前实现）
#   simulation.launch.py
#     └─ include robot_a_sim_control/launch/robot_a_truth_navigation.launch.py
#          （既有 2026-10-23 链路：command_bridge -> wheel_odometry/truth_localization
#            -> pointcloud_to_laserscan -> Nav2(AMCL+NavFn+DWB) -> RViz）
composed_from:
  - package: robot_a_sim_control
    launch: launch/robot_a_truth_navigation.launch.py
    note: 既有实现，未修改；拆分计划见 src/robot_a_sim_control/VENDORED.md
