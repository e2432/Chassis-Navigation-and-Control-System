# Robot A 传感器模型配置（W2 / E08：接入雷达与 IMU）
#
# 对应脚本：tools/engineering/e08_sensor_pipeline.py（仿真侧）、tools/engineering/e08_ros_verify.py（订阅端实测）
# 证据：results/w2/e08/（sensors_log.csv、bag_analysis.txt、cloud_frames.csv、imu_frames.csv）
# 说明：docs/engineering/sensors.md
#
# 参数来源优先级：底盘 PDF 规格书（AGL-CHS-03-F01 V1.2）> 明确标注的假设
# 本文件里的 `nominal` 是"设计目标"，`measured` 是本机实测（Linux + RTX 5070，headless），
# 两者不一致的地方一律按实测记录，不按目标反推。

sensors:
  lidar:
    # ---- 规格（PDF 2.4）----
    spec:
      source: "AGL-CHS-03-F01 产品规格书 V1.2 第 2.4 节"
      count: 2                     # 2 台 3D 固态雷达，对角安装
      model: "未在规格书中写明具体型号（按 40 m@10% 反射率、FOV −7°~52° 判断接近 Livox Mid-360 量级）"
      range_typical_m: 40          # 40 m @ 10% 反射率
      range_max_m: 100             # 截止量程
      hfov_deg: 360
      vfov_deg: [-7, 52]
      note: 'PDF 只写"固态雷达"，未给线数/角分辨率/点频；下方 sim 段是我们建立的通用 3D 雷达模型参数'

    # ---- 仿真模型（本仓库实现）----
    sim:
      implementation: physx_raycast_3d
      why_not_official_asset: >-
        Isaac Sim 5.1 自带 18 个 RTX 雷达 USD 配置（NVIDIA/SLAMTEC/SICK/ZVISION/
        Velodyne/HESAI/Ouster）与 47 个 JSON 配置文件里**没有** Livox Mid-360，且本机
        未安装 /Isaac/Sensors 传感器资产包（Nucleus/资产包不可达）。因此 E08 不接现成
        RTX 雷达资产，改用 PhysX 射线投射实现一个参数可配的通用 3D 固态雷达模型。
      raycast_api: omni.physx.get_physx_scene_query_interface().raycast_all
      self_filter_prefix: /World/robot_a      # 排除打在自身车体上的射线（−7° 下俯会打到车顶）
      h_rays: 360                  # 水平 1°/束
      v_rays: 8                    # 垂直 8 束（Mid-360 原生 8 束/组，但扫描是非重复花瓣图样）
      point_per_frame: 2880        # = h_rays × v_rays
      max_range_m: 40              # 与本机 `--max-range` 一致
      frame_cost_ms_measured: 16.7 # 实测单帧射线耗时（均值，max 20.4 ms）

    # ---- 话题与坐标系 ----
    ros:
      topic: /lidar/points          # 契约 v1.1 口径（原 /points_raw 已废弃）
      topic_alias: /points_raw      # 旧名：需要兼容旧脚本时用 isaac_sim_bridge.py --cloud-alias /points_raw 同时发
      msg_type: sensor_msgs/PointCloud2
      frame_id: lidar_front_link
      fields: [x, y, z]            # FLOAT32 ×3，point_step=12，无 intensity/ring/time
      qos:
        reliability: best_effort
        history: keep_last
        depth: 5
      publish_rate_hz:
        nominal: 10                # 设计目标
        mechanism: "OnCustomEvent 边沿触发（见下）"
        measured: 10.02            # 实测（results/w2/e08/bag_analysis.txt，仿真时间基准）
        measured_dup_factor: 1.00  # 重复发布倍数（1.00 = 每条消息都是新数据）
        measured_note: "178 条 / 17.77 s 仿真时间；按 10 Hz 应收 178 帧，缺口 0"

    # ---- 安装位姿（与 URDF 一致，属 E05 的假设值，待整机成员实测）----
    mount:
      frame: lidar_front_link
      xyz_m: [0.13, 0.13, 0.2185]     # 对角上角，顶面上方 0.0325 m
      rpy_deg: [0, 0, 0]
      pose_status: assumed

  imu:
    spec:
      source: "AGL-CHS-03-F01 产品规格书 V1.2 第 2.5 节"
      count: 1
      integrated_in: lidar_front   # IMU 集成在 3D 雷达内
      output_hz: 200               # 规格书标称
    sim:
      implementation: isaacsim.sensors.physics.IMUSensor
      prim_path: /World/robot_a/base_link/ImuE08
      sensor_frequency_hz: 200     # 传感器采样频率（= 物理子步频率上限）
      read_gravity: true           # 线性加速度含重力：水平静止时 az≈+9.81 —— 符合真实 IMU
      noise: none                  # 未建模噪声/偏置；如需 E13 再补
      # 重要限制：数据只在物理步里更新，而 ROS 发布走渲染帧/事件；
      # 因此"发布频率"最高就是物理步频率（实测约 60 Hz），达不到规格书 200 Hz。
    ros:
      topic: /imu
      qos: {reliability: best_effort, history: keep_last, depth: 50}
      msg_type: sensor_msgs/Imu
      frame_id: imu_link
      publish_on: physics_step     # 每个物理步发一次（不吃重复帧）
      publish_rate_hz:
        nominal: 200
        measured: 60.11            # 实测 = 物理步率（仿真 60 Hz），见 results/w2/e08/bag_analysis.txt
        measured_note: "1068 条 / 17.77 s；相对 200 Hz 缺口 69.9%，是发布路径上限而非丢包"
      fields_published: [orientation, angular_velocity, linear_acceleration]

# ---- 发布机制（为什么不是简单地把节点挂到 OnPlaybackTick）----
publishing:
  problem: >-
    isaacsim.ros2.bridge 的 ROS2PublishPointCloud / ROS2PublishImu 是"每 tick 把当前
    输入值发一次"。直接接 OnPlaybackTick 时实测 /lidar/points 与 /imu 都变成 ~84 Hz
    （= 渲染 tick 率，约为物理步率的 1.4 倍），数据其实 10 Hz / 60 Hz 才更新，
    等于把同一帧重复发布，Nav2/SLAM 会把它当 84 Hz 传感器用。
  solution: >-
    用 omni.graph.action.OnCustomEvent 做边沿触发：Python 侧每到该发新数据时推一个
    carb 事件（omni.graph.action.e08_pub_cloud / e08_pub_imu），事件 → 恰好一次发布。
    用 omni.graph.action.Counter 计数验证过 1:1（推 100 次事件 = 100 次发布，
    与 tick 数无关）。
  alternative_rejected: >-
    也曾试过 omni.graph.action.Branch 电平门控：app.update() 一次可能跑 1~2 个 tick，
    电平会被消费多次（实测 1.4× 重复），因此弃用。
  latency: >-
    OnCustomEvent 是 pop 订阅，发布发生在下一次图求值（约 1 个 tick，≤20 ms），
    时间戳仍取发布时刻的仿真时间，故时间戳与数据的偏差 ≤1 帧。

# ---- 与真实传感器/官方资产的差异（禁止对外声称"等价于 Mid-360"）----
differences_from_real_sensor:
  - "扫描图样：真实 Mid-360 是非重复花瓣扫描，本模型是 360×8 规则栅格，会低估/高估同一物体在不同帧的落点数。"
  - "光束一致性：射线投射是理想直线，无发散角、未额外模拟硬件最小测距（仍有几何近场覆盖不足）、无多次回波。"
  - "噪声与精度：无距离噪声、无反射率（无 intensity 字段）、无丢点率模型。"
  - "运动畸变：单帧内所有射线用同一时刻位姿，无扫描过程中的运动畸变（真实雷达有）。"
  - "频率上限：规格书 IMU 200 Hz，本实现发布频率 = 物理步率（约 60 Hz）；雷达 10 Hz 可达。"
  - "双雷达：规格书是 2 台对角安装，E08 只建了前向 1 台（后向那台留 E09/E10 再补）。"
