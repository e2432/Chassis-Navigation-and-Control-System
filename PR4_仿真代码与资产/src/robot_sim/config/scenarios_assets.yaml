# 仿真资产清单（对应仓库根目录 assets/，见 docs/engineering/assets.md）
#
# 分发方式已固定：资产随仓库走 Git（总量约 3.1 MB），完整性由
# `tools/engineering/verify_assets.sh` 按 assets/MANIFEST.sha256 校验。
# 大体积资产（如需引入厂房/大场景）另立清单并走仓库外分发，见 docs/engineering/assets.md。

assets_root: assets/

scenes:
  - id: scene_robot_a_nav
    file: assets/scene_robot_a_nav.usd
    purpose: 静态地图导航主场景（E11 基准避障的第一个候选场景）
    robot: robot_a
    sensors: [lidar]
    ros_graphs: [发布 /clock 与 /tf 的既有 Graph]
    status: 已纳入仓库，未在本期重新验证
    source: robot_a_navigation_sim_bundle_20261023（2026-10-23）

  - id: scene_simulation
    file: assets/scene_simulation.usd
    purpose: 原始环境层（被 scene_robot_a_nav 组合引用）
    status: 已纳入仓库
    source: 同上

  - id: lidar_3D_maze
    file: assets/robot_a_isaac/lidar_3D_maze.usd
    purpose: 3D 雷达/建图用迷宫场景
    status: 已纳入仓库
    source: 同上

  - id: lidar_3D_maze_nav
    file: assets/robot_a_isaac/lidar_3D_maze_nav.usd
    purpose: 在线 SLAM/Nav2 场景
    status: 已纳入仓库
    source: 同上

robot_assets:
  - id: robot_a_complete
    file: assets/robot_a_isaac/robot_a_complete.usd
    purpose: RobotA 完整模型（base_link / livox_frame / 轮关节 / ROS Graph）
    links_of_interest: [base_link, livox_frame]
    note: 没有 imu 帧，E08/W3 补

extensions:
  - id: robot_a.kinematic_base
    version: 0.4.0
    path: isaac_exts/robot_a.kinematic_base
    purpose: 麦轮位姿锁定与轮速驱动的运动学底盘
    status: 已纳入仓库（未修改）
    source: 同上
