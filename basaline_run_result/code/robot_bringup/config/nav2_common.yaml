# 共享配置（三基线 + MPC 必须完全一致）—— 9-1 §2「共同实验常量」
# 任何改动都要先停调参、双方同步版本、三基线重跑工作集（不允许只对某一基线生效）。
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_controller_bt_node

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"     # 三基线共用同一全局规划器
      tolerance: 0.25
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      smooth_path: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      # 尺寸必须覆盖整条路径（场景路径最长约 12 m）。Nav2 默认 5 m×5 m，
      # 会把 10 m 外的目标点钳到地图边缘——2026-11-14 实测：目标点被钳后
      # 规划出 0.12 m 的"已到达"路径，run 会假成功，必须显式给足范围。
      width: 40
      height: 40
      origin_x: -20.0
      origin_y: -20.0
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      # 静态地图层：内容由契约清单（docs/scenarios/instances.yaml）在采集时发布到 /map。
      # 为什么全局层要静态图：Isaac 射线雷达每帧仅约 500 点（pointid_step=12），标出的
      # 障碍是带孔洞的细弧，SmacPlanner2D 会从孔洞穿过去，DWB 到跟前无可行轨迹即停
      # （2026-11-14 实测反复停在 x≈4.5 / x≈7.96）。场景几何是已知且四基线共享的，
      # 因此全局规划用清单几何；**局部避障与安全判定仍用实时 /lidar/points**。
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      # 注意（E08 实测）：雷达有 2.63 m 近场盲区，min_obstacle_height 与 range 需按此设
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan3d
        scan3d:
          topic: /lidar/points
          data_type: "PointCloud2"
          max_obstacle_height: 2.0
          min_obstacle_height: 0.05        # 过滤地面点（雷达 z 已转 body 系）
          obstacle_max_range: 10.0         # 场景 12 m 内
          obstacle_min_range: 0.0
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          # Round 0（2026-11-15）：全局层关闭 clearing。
          # 依据：静态层（清单几何）画上去的墙会被点云层的 raytrace 清除掉——实测
          # dead_end run403 静态图有 1162 格墙，全局代价地图却始终只有 420 个致命格
          # （= 点云自己标的那部分），robot 于是从墙里穿过去。
          # 本实验按"已知地图障碍位置"的口径，全局层不需要靠点云清图；动态障碍
          # （行人）在局部层的点云里仍然实时可见、实时标记。
          clearing: false
          marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55             # ≥ footprint 外接半径 + 目标间距 0.30
      footprint: "[[0.3215, 0.113], [0.113, 0.328], [-0.113, 0.328], [-0.3215, 0.113], [-0.3215, -0.113], [-0.113, -0.328], [0.113, -0.328], [0.3215, -0.113]]"
      # Round 0 调参（2026-11-15）：0.02 → 0.10
      # 依据：工作集 75 run 里失败 run 的间距分布显示，dead_end 的 13 次失败全部是
      # 间距 ≈0.000 m 的"贴墙擦过"（不是撞墙），而成功 run 的间距中位只有 0.16~0.27 m，
      # 已低于 9-1 §4.1 的 0.20 m 硬底线。把控制器内部的安全包络放大 0.10 m，
      # 让路径离障碍更远；**判分仍用真实足迹（judge 不看 padding）**，所以这不是改判据。
      footprint_padding: 0.02          # Round 0 A/B 结论：0.10 对 TEB 无效、且让 DWA 402 变差，已退回

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # Round 0（2026-11-15）：局部代价地图也加载清单几何（static_layer）。
      # 依据：本实验按确认过的口径"不做自建图、已知地图障碍位置"，那么**局部**层也应该
      # 知道墙在哪；只给全局层会导致 TEB 这类"约束来自局部代价地图"的控制器在近场
      # 只看到点云（雷达 2.63 m 盲区 + 每帧约 500 点），dead_end 4/4 全部切角撞墙。
      # 点云层保留在后面，负责发现静态图里没有的东西（行人等动态物体）。
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        observation_sources: scan3d
        scan3d:
          topic: /lidar/points
          data_type: "PointCloud2"
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          obstacle_max_range: 6.0
          raytrace_max_range: 6.0
          clearing: true
          marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      footprint: "[[0.3215, 0.113], [0.113, 0.328], [-0.113, 0.328], [-0.3215, 0.113], [-0.3215, -0.113], [-0.113, -0.328], [0.113, -0.328], [0.3215, -0.113]]"
      # Round 0 调参（2026-11-15）：0.02 → 0.10
      # 依据：工作集 75 run 里失败 run 的间距分布显示，dead_end 的 13 次失败全部是
      # 间距 ≈0.000 m 的"贴墙擦过"（不是撞墙），而成功 run 的间距中位只有 0.16~0.27 m，
      # 已低于 9-1 §4.1 的 0.20 m 硬底线。把控制器内部的安全包络放大 0.10 m，
      # 让路径离障碍更远；**判分仍用真实足迹（judge 不看 padding）**，所以这不是改判据。
      footprint_padding: 0.02          # Round 0 A/B 结论：0.10 对 TEB 无效、且让 DWA 402 变差，已退回

# 共享执行层：平面限速 → 安全层 → 底盘。三级职责必须分开记清楚：
#   controller_server ─/cmd_vel_raw─▶ flat_speed_limiter ─/cmd_vel_limited─▶
#     safety_supervisor ─/cmd_vel─▶ Isaac 桥接（底盘只订阅 /cmd_vel）
# 限速层管"契约口径的形状"（合速度/角速度/加速度，四控制器同等生效）；
# 安全层管"安全事件"（人工接管、里程计失联、上游违规、碰撞临近），触发即清零并在
# /safety/stop 上给上升沿——9-1 的 estop_count 数这个。
flat_speed_limiter:
  ros__parameters:
    use_sim_time: true
    input_topic: /cmd_vel_raw          # Nav2 controller / MPC 原始输出
    output_topic: /cmd_vel_limited     # 限速后（送安全层）
    record_topic: ""                   # 空 = 不再重复发镜像（会造成同话题双发布者）
    max_planar_speed: 0.6              # √(vx²+vy²) ≤ 0.6
    max_wz: 1.5
    max_ax: 1.0                        # 机体系加速度限幅
    max_ay: 1.0
    max_alpha: 2.0
    publish_rate: 20.0

safety_supervisor:
  ros__parameters:
    use_sim_time: true
    input_topic: /cmd_vel_limited
    output_topic: /cmd_vel             # 唯一速度出口（底盘/桥接只订阅这个）
    stop_topic: /safety/stop
    request_topic: /safety/stop_request
    status_topic: /safety/status
    odom_topic: /odom
    cloud_topic: /lidar/points
    base_frame: base_link
    max_planar_speed: 0.6
    max_wz: 1.5
    odom_timeout_s: 0.5                # /odom 超时即制动
    guard_enabled: true
    guard_radius_m: 0.36               # 底盘外接半径 0.343 + 余量；"马上要撞"才触发
    release_hold_s: 0.3
    publish_rate: 20.0
